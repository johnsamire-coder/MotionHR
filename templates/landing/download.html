<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق MotionHR</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #37474F, #263238);
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    p { font-size: 18px; opacity: 0.9; }
    .download-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 16px 40px;
      background: #00C853;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 200, 83, 0.4);
      transition: all 0.3s;
    }
    .download-btn:hover {
      transform: scale(1.05);
      background: #00B140;
    }
    .warning {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 تحميل تطبيق MotionHR</h1>
    <p>اضغط على الزر أدناه لتحميل أحدث نسخة من التطبيق</p>

    <a href="/static/motionhr.apk" class="download-btn">
      ⬇️ تحميل التطبيق (APK)
    </a>

    <div class="warning">
      ⚠️ التطبيق للأندرويد فقط<br>
      بعد التحميل، فعّل "التثبيت من مصادر غير معروفة" في إعدادات هاتفك
    </div>
  </div>
</body>
</html>
